<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel · Sound Audio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #090d18;
            --surface: #0e1422;
            --card:    #111928;
            --border:  #1a2540;
            --blue:    #4d8ef0;
            --blue2:   #7eb0f7;
            --text:    #dce8ff;
            --muted:   #4d6490;
            --dim:     #1a2b4a;
            --red:     #e05555;
            --green:   #3ecf72;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* Login Screen */
        #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 2rem; width: 100%; max-width: 400px; text-align: center; }
        .login-box h1 { font-family: 'Syne', sans-serif; font-size: 1.8rem; margin-bottom: 0.5rem; }
        
        /* Main UI */
        #main-screen { display: none; }
        .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .topbar-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--text); }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* Save Bar */
        .save-bar { 
            background: rgba(77,142,240,.1); border: 1px solid rgba(77,142,240,.3); 
            border-radius: 12px; padding: 1rem; display: none; 
            align-items: center; justify-content: space-between; margin-bottom: 2rem;
            border-left: 4px solid var(--blue);
        }
        .save-bar.visible { display: flex; }

        /* Album Card */
        .album-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 1.5rem; overflow: hidden; transition: 0.3s; }
        .album-item-header { display: flex; align-items: center; gap: 1rem; padding: 1.2rem; cursor: pointer; }
        .album-item-header:hover { background: var(--surface); }
        .album-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: var(--dim); border: 1px solid var(--border); }
        .album-info { flex: 1; }
        .album-name { font-weight: 600; font-size: 1.1rem; }
        .album-meta { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--blue); text-transform: uppercase; margin-top: 2px; }

        .album-editor { display: none; padding: 1.5rem; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); }
        .album-item.open .album-editor { display: block; }
        .chevron { transition: 0.3s; color: var(--muted); }
        .album-item.open .chevron { transform: rotate(180deg); color: var(--blue); }

        /* Inputs */
        .field-group { margin-bottom: 1.2rem; }
        .field-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; display: block; font-weight: 700; }
        .field-input { width: 100%; padding: 0.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; }
        .field-input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(77,142,240,0.1); }

        /* Tracks List */
        .track-row { 
            display: grid; grid-template-columns: 1fr 1fr 80px 70px 40px; 
            gap: 0.6rem; align-items: center; margin-bottom: 0.6rem; 
            background: var(--dim); padding: 6px 10px; border-radius: 8px; 
        }
        .track-row input { padding: 0.4rem; background: transparent; border: none; color: var(--text); font-size: 0.85rem; outline: none; }
        .track-row input:focus { background: var(--surface); border-radius: 4px; }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.4rem; border-radius: 9px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--blue); color: #000; }
        .btn-secondary { background: var(--dim); color: var(--text); }
        .btn-secondary:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-danger { background: rgba(224,85,85,0.1); color: var(--red); border: 1px solid rgba(224,85,85,0.2); }
        .btn-danger:hover { background: var(--red); color: #000; }

        .sort-btns { display: flex; gap: 4px; }
        .sort-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 4px; cursor: pointer; border: none; color: var(--text); font-size: 10px; transition: 0.2s; }
        .sort-btn:hover:not(:disabled) { background: var(--blue); color: #000; }

        .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 2rem; text-align: center; margin-top: 1.5rem; cursor: pointer; transition: 0.2s; color: var(--muted); background: rgba(255,255,255,0.01); }
        .upload-zone:hover { border-color: var(--blue); color: var(--blue2); background: rgba(77,142,240,0.05); }
        .upload-zone i { font-size: 2rem; margin-bottom: 0.8rem; display: block; }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div style="font-size: 2.5rem; color: var(--blue); margin-bottom: 1rem;"><i class="fas fa-fingerprint"></i></div>
        <h1 style="font-family:'Syne'">Sound Admin</h1>
        <p style="font-family:'Share Tech Mono'; color:var(--muted); margin-bottom: 2rem; font-size: 0.8rem;">PROTECTED ACCESS · 2026</p>
        <input class="field-input" id="login-repo" type="text" placeholder="owner/repo" value="christian-word/Audio-PlayEpic">
        <input class="field-input" id="login-token" type="password" placeholder="GitHub Personal Token">
        <button class="btn btn-primary" id="login-btn" style="width:100%; justify-content: center;">АВТОРИЗАЦИЯ</button>
    </div>
</div>

<div id="main-screen">
    <div class="topbar">
        <div class="topbar-logo">SOUND <span style="color:var(--blue)">ADMIN</span></div>
        <button class="btn btn-secondary" id="logout-btn"><i class="fas fa-power-off"></i></button>
    </div>

    <div class="container">
        <div class="save-bar" id="save-bar">
            <span><i class="fas fa-sync-alt"></i> Конфигурация изменена. Требуется синхронизация.</span>
            <button class="btn btn-primary" id="save-btn"><i class="fas fa-cloud-upload-alt"></i> СОХРАНИТЬ В GITHUB</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2.5rem;">
            <h2 style="font-family:'Syne'; font-size: 1.8rem;">Медиатека</h2>
            <button class="btn btn-primary" id="add-album-btn"><i class="fas fa-plus-circle"></i> НОВЫЙ АЛЬБОМ</button>
        </div>

        <div id="albums-list"></div>
    </div>
</div>

<script>
let TOKEN = '', REPO = '', BRANCH = 'main';
let albumsData = [];
let albumsSha = '';

// --- Загрузка и инициализация ---
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('login-btn').onclick = login;
    document.getElementById('logout-btn').onclick = () => { localStorage.clear(); location.reload(); };
    document.getElementById('add-album-btn').onclick = addAlbum;
    document.getElementById('save-btn').onclick = saveToGitHub;

    if(localStorage.getItem('sap_token')) {
        TOKEN = localStorage.getItem('sap_token');
        REPO = localStorage.getItem('sap_repo');
        startAdmin();
    }
});

// --- Вспомогательные функции ---
async function getAudioDuration(file) {
    return new Promise((resolve) => {
        const audio = new Audio();
        const reader = new FileReader();
        reader.onload = (e) => {
            audio.src = e.target.result;
            audio.onloadedmetadata = () => resolve(Math.round(audio.duration));
            audio.onerror = () => resolve(0);
        };
        reader.readAsDataURL(file);
    });
}

function markDirty() { document.getElementById('save-bar').classList.add('visible'); }

// --- Логика админки ---
async function login() {
    TOKEN = document.getElementById('login-token').value.trim();
    REPO = document.getElementById('login-repo').value.trim();
    if(!TOKEN) return alert("Введите GitHub Token!");
    startAdmin();
}

async function startAdmin() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    localStorage.setItem('sap_token', TOKEN);
    localStorage.setItem('sap_repo', REPO);
    loadAlbums();
}

async function loadAlbums() {
    const list = document.getElementById('albums-list');
    list.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--muted);"><i class="fas fa-circle-notch spin"></i> Чтение базы данных...</div>';
    try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/albums.json?ref=${BRANCH}`, {
            headers: { 'Authorization': `token ${TOKEN}` }
        });
        const file = await res.json();
        albumsSha = file.sha;
        albumsData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
        render();
    } catch(e) { list.innerHTML = "Ошибка подключения к репозиторию."; }
}

function render() {
    const list = document.getElementById('albums-list');
    list.innerHTML = '';
    
    albumsData.forEach((album, ai) => {
        const item = document.createElement('div');
        item.className = 'album-item';
        const iconUrl = album.icon && !album.icon.startsWith('http') 
            ? `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${album.icon}` 
            : (album.icon || '');

        item.innerHTML = `
            <div class="album-item-header" onclick="this.parentElement.classList.toggle('open')">
                <img src="${iconUrl}" class="album-thumb" onerror="this.src='https://placehold.co/100x100?text=NONE'">
                <div class="album-info">
                    <div class="album-name">${album.name}</div>
                    <div class="album-meta">${album.category} · ${album.tracks.length} ТРЕКОВ</div>
                </div>
                <i class="fas fa-chevron-down chevron"></i>
            </div>
            <div class="album-editor">
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.2rem; margin-bottom:1.5rem;">
                    <div>
                        <label class="field-label">Название альбома</label>
                        <input class="field-input" value="${album.name}" oninput="updateAlbum(${ai}, 'name', this.value)">
                    </div>
                    <div>
                        <label class="field-label">Категория</label>
                        <input class="field-input" value="${album.category}" oninput="updateAlbum(${ai}, 'category', this.value)">
                    </div>
                    <div>
                        <label class="field-label">Путь к иконке</label>
                        <input class="field-input" value="${album.icon || ''}" oninput="updateAlbum(${ai}, 'icon', this.value)" placeholder="Music/Album/icon.jpg">
                    </div>
                </div>
                
                <div style="font-family:'Syne'; font-size:0.75rem; margin-bottom:0.8rem; color:var(--muted); letter-spacing:1px;">ТРЕК-ЛИСТ</div>
                <div id="tracks-${ai}"></div>

                <div class="upload-zone" id="drop-${ai}" onclick="document.getElementById('file-${ai}').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    Кликните для выбора MP3 или перетащите файлы<br>
                    <span style="font-size:0.7rem; opacity:0.6">Авто-расчет длительности и чистка имен включены</span>
                    <input type="file" id="file-${ai}" multiple style="display:none" onchange="uploadFiles(${ai}, this.files)">
                </div>
                
                <div style="margin-top:2rem; display:flex; justify-content:flex-end;">
                    <button class="btn btn-danger" style="font-size:0.75rem; padding:0.5rem 1rem;" onclick="deleteAlbum(${ai})"><i class="fas fa-trash-alt"></i> УДАЛИТЬ АЛЬБОМ</button>
                </div>
            </div>
        `;
        list.appendChild(item);
        renderTracks(ai);
    });
}

function renderTracks(ai) {
    const cont = document.getElementById(`tracks-${ai}`);
    const tracks = albumsData[ai].tracks;
    
    cont.innerHTML = tracks.map((t, ti) => `
        <div class="track-row">
            <input type="text" value="${t.name}" oninput="updateTrack(${ai}, ${ti}, 'name', this.value)" placeholder="Имя">
            <input type="text" value="${t.url}" placeholder="URL" readonly style="opacity:0.5; font-size:0.7rem;">
            <input type="number" value="${t.duration}" oninput="updateTrack(${ai}, ${ti}, 'duration', this.value)" title="Секунды">
            
            <div class="sort-btns">
                <button class="sort-btn" onclick="moveTrack(${ai}, ${ti}, -1)" ${ti === 0 ? 'disabled' : ''}>▲</button>
                <button class="sort-btn" onclick="moveTrack(${ai}, ${ti}, 1)" ${ti === tracks.length - 1 ? 'disabled' : ''}>▼</button>
            </div>

            <button class="btn btn-danger" style="padding:0.4rem; background:transparent; border:none;" onclick="deleteTrack(${ai}, ${ti})"><i class="fas fa-times"></i></button>
        </div>
    `).join('');
}

// --- Управление данными ---
function updateAlbum(ai, k, v) { albumsData[ai][k] = v; markDirty(); }
function updateTrack(ai, ti, k, v) { albumsData[ai].tracks[ti][k] = (k==='duration' ? parseInt(v) : v); markDirty(); }

function moveTrack(ai, ti, direction) {
    const tracks = albumsData[ai].tracks;
    const newIndex = ti + direction;
    if (newIndex < 0 || newIndex >= tracks.length) return;
    [tracks[ti], tracks[newIndex]] = [tracks[newIndex], tracks[ti]];
    markDirty();
    renderTracks(ai);
}

async function uploadFiles(ai, files) {
    const album = albumsData[ai];
    const dropZone = document.getElementById(`drop-${ai}`);
    const folderName = album.name.trim() || "New_Album";

    for (let file of Array.from(files)) {
        dropZone.innerHTML = `<i class="fas fa-spinner spin"></i> ЗАГРУЗКА: ${file.name}`;
        const path = `Music/${folderName}/${file.name}`;
        
        try {
            let duration = 0;
            if (file.type.startsWith('audio/') || file.name.endsWith('.m4a') || file.name.endsWith('.mp3')) {
                duration = await getAudioDuration(file);
            }

            const reader = new FileReader();
            const uploadTask = new Promise((resolve, reject) => {
                reader.onload = async () => {
                    const content = reader.result.split(',')[1];
                    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Add ${file.name}`, content, branch: BRANCH })
                    });
                    if(r.ok) resolve(); else reject();
                };
            });
            reader.readAsDataURL(file);
            await uploadTask;

            if (file.type.startsWith('audio/') || file.name.endsWith('.m4a') || file.name.endsWith('.mp3')) {
                const cleanName = file.name.replace(/\.[^/.]+$/, "");
                album.tracks.push({ name: cleanName, url: path, duration: duration });
            } else if (file.type.startsWith('image/')) {
                album.icon = path;
            }
            markDirty(); render();
        } catch(e) { alert("Критическая ошибка загрузки!"); }
    }
    render();
}

async function saveToGitHub() {
    const btn = document.getElementById('save-btn');
    btn.innerHTML = '<i class="fas fa-spinner spin"></i> СИНХРОНИЗАЦИЯ...';
    try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(albumsData, null, 4))));
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/albums.json`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Update albums.json via Admin PRO", content, sha: albumsSha, branch: BRANCH })
        });
        if(res.ok) {
            const data = await res.json();
            albumsSha = data.content.sha;
            document.getElementById('save-bar').classList.remove('visible');
            alert("Данные успешно сохранены в облаке!");
        }
    } catch(e) { alert("Ошибка сохранения."); }
    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> СОХРАНИТЬ В GITHUB';
}

function addAlbum() { albumsData.unshift({ name: "Новый Альбом", category: "epic", icon: "", tracks: [] }); render(); markDirty(); }
function deleteAlbum(ai) { if(confirm("Удалить альбом и все ссылки на треки?")) { albumsData.splice(ai, 1); render(); markDirty(); } }
function deleteTrack(ai, ti) { albumsData[ai].tracks.splice(ti, 1); render(); markDirty(); }
</script>
</body>
</html>
