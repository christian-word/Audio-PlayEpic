<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina · Universal Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        /* ═══════════════ TOKENS ═══════════════ */
        :root {
            --bg:          #f4f7fa;
            --surface:     #ffffff;
            --surface2:    #f8fafc;
            --border:      #e2e8f0;
            --accent:      #ae5f9d;
            --accent2:     #7c3aed;
            --accent-glow: rgba(174,95,157,0.22);
            --text:        #1e293b;
            --muted:       #64748b;
            --dim:         #f1f5f9;
            --player-bg:   rgba(255,255,255,0.97);
            --toast-bg:    #1e293b;
            --toast-text:  #ffffff;
            --red:         #e05555;
            --green:       #3ecf72;
            --blue:        #4d8ef0;
            --card:        #ffffff;
        }
        [data-theme="dark"] {
            --bg:          #0f0f14;
            --surface:     #1a1a24;
            --surface2:    #141420;
            --border:      #2a2a38;
            --accent:      #c478b4;
            --accent2:     #9d6fef;
            --accent-glow: rgba(196,120,180,0.25);
            --text:        #e8e8f0;
            --muted:       #8080a0;
            --dim:         #1e1e2c;
            --player-bg:   rgba(20,20,32,0.98);
            --toast-bg:    #e8e8f0;
            --toast-text:  #0f0f14;
            --card:        #1a1a24;
        }

        /* ═══════════════ RESET ═══════════════ */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 195px;
            overflow-x: hidden;
            transition: background 0.4s, color 0.4s;
        }
        body::before {
            content:'';
            position:fixed; inset:0;
            background:
                radial-gradient(ellipse 55% 45% at 15% 10%, rgba(174,95,157,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 45% 55% at 85% 85%, rgba(124,58,237,0.05) 0%, transparent 60%);
            pointer-events:none; z-index:0;
        }
        [data-theme="dark"] body::before {
            background:
                radial-gradient(ellipse 55% 45% at 15% 10%, rgba(196,120,180,0.09) 0%, transparent 60%),
                radial-gradient(ellipse 45% 55% at 85% 85%, rgba(157,111,239,0.07) 0%, transparent 60%);
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; position: relative; z-index: 1; }

        /* ═══════════════ HEADER ═══════════════ */
        header { text-align:center; padding: 2.5rem 0 1.8rem; position:relative; }
        .header-logo { display:inline-flex; align-items:center; justify-content:center; gap:14px; margin-bottom:6px; }
        .logo-icon {
            width:52px; height:52px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius:16px; display:flex; align-items:center; justify-content:center;
            font-size:1.35rem; color:white;
            box-shadow: 0 8px 24px var(--accent-glow); flex-shrink:0;
        }
        h1 {
            font-family:'Syne', sans-serif; font-size:2.8rem; font-weight:800;
            text-transform:uppercase;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .subtitle { color:var(--muted); font-size:0.72rem; letter-spacing:0.32em; font-family:'Share Tech Mono',monospace; margin-top:6px; }
        .church-tag { color:var(--accent); font-size:0.62rem; letter-spacing:0.35em; font-family:'Share Tech Mono',monospace; margin-top:7px; text-transform:uppercase; font-weight:700; }

        /* ═══════════════ THEME TOGGLE ═══════════════ */
        .theme-toggle {
            position:absolute; top:2.5rem; right:0;
            width:46px; height:26px; background:var(--dim);
            border:1px solid var(--border); border-radius:13px;
            cursor:pointer; transition:all 0.3s; display:flex; align-items:center; padding:3px;
        }
        .theme-toggle::after {
            content:''; width:18px; height:18px; border-radius:50%; background:var(--accent);
            transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); display:block;
        }
        [data-theme="dark"] .theme-toggle::after { transform:translateX(20px); }
        .theme-toggle .t-sun { position:absolute; left:6px; font-size:0.6rem; color:var(--muted); }
        .theme-toggle .t-moon { position:absolute; right:6px; font-size:0.6rem; color:var(--muted); }

        /* Admin edit button */
        .admin-toggle-btn {
            position:absolute; top:2.5rem; left:0;
            display:inline-flex; align-items:center; gap:7px;
            padding: 6px 13px 6px 9px;
            background:var(--surface); border:1px solid var(--border);
            border-radius:12px; cursor:pointer; transition:all 0.25s;
            color:var(--muted); font-size:0.72rem; font-weight:700;
            font-family:'DM Sans', sans-serif; letter-spacing:0.04em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .admin-toggle-btn:hover {
            border-color:var(--accent); color:var(--accent);
            background:var(--surface);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .floppy-body { stroke: var(--muted); transition: stroke 0.25s; }
        .floppy-shutter { fill: var(--muted); transition: fill 0.25s; }
        .admin-toggle-btn:hover .floppy-body { stroke: var(--accent); }
        .admin-toggle-btn:hover .floppy-shutter { fill: var(--accent); }

        /* ═══════════════ NAV LINKS ═══════════════ */
        .nav-links { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:1.6rem 0 2rem; }
        .nav-link {
            display:inline-flex; align-items:center; gap:8px; padding:9px 18px;
            border-radius:14px; font-size:0.8rem; font-weight:700;
            font-family:'DM Sans',sans-serif; text-decoration:none;
            transition:all 0.25s ease; border:1px solid var(--border);
            background:var(--surface); box-shadow:0 2px 8px rgba(0,0,0,0.04);
        }
        .nav-link .nl-icon { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.8rem; flex-shrink:0; }
        .nav-link.fonki { color:#c2621a; }
        .nav-link.fonki .nl-icon { background:rgba(220,100,30,0.1); color:#d4692a; }
        .nav-link.fonki:hover { background:rgba(220,100,30,0.05); border-color:rgba(220,100,30,0.35); transform:translateY(-2px); box-shadow:0 6px 18px rgba(220,100,30,0.1); }
        .nav-link.holy { color:#2874a6; }
        .nav-link.holy .nl-icon { background:rgba(40,116,166,0.1); color:#2980b9; }
        .nav-link.holy:hover { background:rgba(40,116,166,0.05); border-color:rgba(40,116,166,0.35); transform:translateY(-2px); box-shadow:0 6px 18px rgba(40,116,166,0.1); }
        .nav-link.kg { color:var(--accent); }
        .nav-link.kg .nl-icon { background:rgba(174,95,157,0.1); color:var(--accent); }
        .nav-link.kg:hover { background:rgba(174,95,157,0.05); border-color:rgba(174,95,157,0.4); transform:translateY(-2px); box-shadow:0 6px 18px var(--accent-glow); }

        /* ═══════════════ SEARCH ═══════════════ */
        .search-wrap { margin-bottom:2rem; position:relative; }
        .search-wrap i { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:0.88rem; }
        .search-input {
            width:100%; padding:1.2rem 1.5rem 1.2rem 3rem;
            background:var(--surface); border:1px solid var(--border);
            border-radius:20px; font-size:1rem; font-family:'DM Sans',sans-serif;
            color:var(--text); outline:none; transition:0.3s;
            box-shadow:0 4px 15px rgba(0,0,0,0.05);
        }
        .search-input::placeholder { color:var(--muted); }
        .search-input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-glow); }

        /* ═══════════════ ALBUMS GRID ═══════════════ */
        .albums-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:1.4rem; }
        .album-card {
            background:var(--surface); padding:1.4rem; border-radius:24px;
            cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            text-align:center; border:1px solid var(--border);
            box-shadow:0 2px 8px rgba(0,0,0,0.04); position:relative; overflow:hidden;
        }
        .album-card:hover { transform:translateY(-8px); border-color:var(--accent); box-shadow:0 16px 36px rgba(0,0,0,0.1); }
        .album-img-wrap { position:relative; display:inline-block; margin-bottom:1rem; }
        .album-img { width:135px; height:135px; border-radius:18px; object-fit:cover; display:block; box-shadow:0 6px 18px rgba(0,0,0,0.14); transition:transform 0.3s; }
        .album-card:hover .album-img { transform:scale(0.96); }
        .album-overlay { position:absolute; inset:0; border-radius:18px; background:rgba(174,95,157,0.65); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.25s; backdrop-filter:blur(2px); }
        .album-card:hover .album-overlay { opacity:1; }
        .album-overlay-icon { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.95); display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:var(--accent); transform:scale(0.8); transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 6px 18px rgba(0,0,0,0.18); }
        .album-card:hover .album-overlay-icon { transform:scale(1); }
        .album-name { font-weight:700; font-size:0.9rem; color:var(--text); }
        .album-count { font-size:0.78rem; color:var(--muted); margin-top:4px; }

        /* ═══════════════ TRACKS ═══════════════ */
        .back-btn {
            display:inline-flex; align-items:center; gap:8px; margin-bottom:20px;
            border:1px solid var(--border); background:var(--surface); cursor:pointer;
            color:var(--accent); font-weight:700; font-size:0.88rem;
            font-family:'DM Sans',sans-serif; padding:8px 16px; border-radius:12px; transition:0.2s;
        }
        .back-btn:hover { background:rgba(174,95,157,0.06); border-color:var(--accent); }
        .track {
            display:flex; align-items:center; gap:1rem; padding:0.9rem 1rem;
            background:var(--surface); border-radius:18px; cursor:pointer;
            margin-bottom:0.75rem; border:1px solid var(--border);
            transition:all 0.2s; box-shadow:0 1px 4px rgba(0,0,0,0.03);
        }
        .track:hover { border-color:var(--accent); background:var(--surface2); transform:translateX(4px); }
        .track.active { border-color:var(--accent); background:var(--surface2); box-shadow:0 5px 20px var(--accent-glow); }
        .track-index-wrap { width:38px; height:38px; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; }
        .track-index { font-family:'Share Tech Mono',monospace; font-size:0.78rem; color:var(--muted); }
        .track-play-icon { color:var(--accent); font-size:1rem; display:none; }
        .track:hover .track-index { display:none; }
        .track:hover .track-play-icon { display:block; }
        .eq { display:none; gap:3px; align-items:flex-end; height:16px; }
        .eq-bar { width:3px; background:var(--accent); border-radius:2px; animation:eq 0.6s infinite alternate; }
        .eq-bar:nth-child(2) { animation-delay:0.2s; }
        .eq-bar:nth-child(3) { animation-delay:0.4s; }
        @keyframes eq { from { height:4px; } to { height:16px; } }
        .track.active .eq { display:flex; }
        .track.active .track-index { display:none; }

        /* ═══════════════ PLAYER BAR ═══════════════ */
        .player {
            position:fixed; bottom:0; left:0; right:0;
            background:var(--player-bg); backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px); border-top:1px solid var(--border);
            padding:12px 0 14px; z-index:1000;
            box-shadow:0 -8px 32px rgba(0,0,0,0.08); transition:background 0.4s;
        }
        .player::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent); opacity:0.55; }
        .player-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; padding:0 20px; gap:16px; flex-wrap:wrap; }
        .player-info { display:flex; align-items:center; gap:12px; width:220px; }
        .cover-wrap { position:relative; flex-shrink:0; width:52px; height:52px; }
        #player-cover { width:52px; height:52px; border-radius:50%; object-fit:cover; box-shadow:0 4px 14px rgba(0,0,0,0.18); border:2px solid var(--accent); display:none; transition:border-color 0.3s; }
        #player-cover.spinning { animation:vinylspin 10s linear infinite; }
        @keyframes vinylspin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
        .cover-needle { position:absolute; top:-4px; right:-8px; width:16px; height:16px; background:var(--accent); border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:none; box-shadow:0 2px 6px var(--accent-glow); }
        .player-name { font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .player-album { font-size:0.72rem; color:var(--muted); font-family:'Share Tech Mono',monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
        .player-wave-area { flex:1; min-width:200px; }
        .status-led { width:8px; height:8px; border-radius:50%; background:var(--border); display:inline-block; margin-bottom:4px; transition:0.3s; }
        .status-led.active { background:var(--accent); box-shadow:0 0 8px var(--accent-glow); animation:ledpulse 2s ease-in-out infinite; }
        @keyframes ledpulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .time-info { font-family:'Share Tech Mono',monospace; font-size:0.7rem; color:var(--muted); margin-top:4px; }
        .action-bar { display:flex; gap:8px; margin-top:8px; }
        .action-btn { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:8px; background:var(--dim); border:1px solid var(--border); color:var(--muted); font-size:0.72rem; font-weight:600; cursor:pointer; transition:0.2s; font-family:'DM Sans',sans-serif; }
        .action-btn:hover { color:var(--accent); border-color:var(--accent); background:var(--accent-glow); }
        .volume-wrap { display:flex; align-items:center; gap:8px; width:130px; flex-shrink:0; }
        .vol-icon { font-size:0.9rem; color:var(--muted); cursor:pointer; transition:0.2s; }
        .vol-icon:hover { color:var(--accent); }
        .volume-slider { -webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:2px; background:var(--border); outline:none; cursor:pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 2px 6px var(--accent-glow); transition:transform 0.2s; }
        .volume-slider::-webkit-slider-thumb:hover { transform:scale(1.25); }
        .volume-slider::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:var(--accent); cursor:pointer; border:none; }
        .player-controls { display:flex; align-items:center; gap:8px; }
        .btn-round { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--dim); color:var(--text); cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; font-size:0.85rem; }
        .btn-round:hover { background:var(--border); color:var(--accent); }
        .btn-round.main { width:56px; height:56px; background:linear-gradient(135deg, var(--accent), var(--accent2)); color:white; font-size:1.2rem; border:none; box-shadow:0 6px 20px var(--accent-glow); }
        .btn-round.main:hover { transform:scale(1.08); box-shadow:0 8px 28px var(--accent-glow); }
        .btn-round.active { background:var(--accent); color:white; border-color:var(--accent); }

        /* ═══════════════ TOAST ═══════════════ */
        .toast { position:fixed; bottom:210px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--toast-bg); color:var(--toast-text); padding:10px 22px; border-radius:22px; font-size:0.82rem; font-weight:600; box-shadow:0 8px 28px rgba(0,0,0,0.18); opacity:0; pointer-events:none; transition:opacity 0.3s, transform 0.3s; z-index:2000; white-space:nowrap; display:flex; align-items:center; gap:8px; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ═══════════════ ADMIN PANEL ═══════════════ */
        #admin-panel {
            display:none; position:fixed; inset:0; z-index:5000;
            background: var(--bg); overflow-y:auto;
        }
        /* Admin Login */
        .admin-login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
        .login-box { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:2.5rem 2rem; width:100%; max-width:400px; text-align:center; }
        .login-box h2 { font-family:'Syne',sans-serif; font-size:1.8rem; margin-bottom:0.5rem; }

        /* Admin topbar */
        .admin-topbar { background:var(--card); border-bottom:1px solid var(--border); padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
        .admin-topbar-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; }

        /* Save bar */
        .save-bar { background:rgba(77,142,240,.1); border:1px solid rgba(77,142,240,.3); border-left:4px solid var(--blue); border-radius:12px; padding:1rem; display:none; align-items:center; justify-content:space-between; margin-bottom:2rem; }
        .save-bar.visible { display:flex; }

        /* Album items */
        .album-item { background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:1.5rem; overflow:hidden; transition:0.3s; }
        .album-item-header { display:flex; align-items:center; gap:1rem; padding:1.2rem; cursor:pointer; }
        .album-item-header:hover { background:var(--surface2); }
        .album-thumb { width:54px; height:54px; border-radius:10px; object-fit:cover; background:var(--dim); border:1px solid var(--border); }
        .album-info { flex:1; }
        .album-info-name { font-weight:600; font-size:1.1rem; }
        .album-meta { font-family:'Share Tech Mono',monospace; font-size:0.75rem; color:var(--blue); text-transform:uppercase; margin-top:2px; }
        .album-editor { display:none; padding:1.5rem; border-top:1px solid var(--border); background:rgba(0,0,0,0.05); }
        [data-theme="dark"] .album-editor { background:rgba(0,0,0,0.2); }
        .album-item.open .album-editor { display:block; }
        .chevron { transition:0.3s; color:var(--muted); }
        .album-item.open .chevron { transform:rotate(180deg); color:var(--accent); }

        /* Fields */
        .field-group { margin-bottom:1.2rem; }
        .field-label { font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:0.4rem; display:block; font-weight:700; }
        .field-input { width:100%; padding:0.8rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); outline:none; font-family:'DM Sans',sans-serif; font-size:0.95rem; }
        .field-input:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }

        /* Track rows */
        .track-row { display:grid; grid-template-columns:1fr 1fr 80px 70px 40px; gap:0.6rem; align-items:center; margin-bottom:0.6rem; background:var(--dim); padding:6px 10px; border-radius:8px; }
        .track-row input { padding:0.4rem; background:transparent; border:none; color:var(--text); font-size:0.85rem; outline:none; }
        .track-row input:focus { background:var(--surface); border-radius:4px; }

        /* Buttons */
        .btn { display:inline-flex; align-items:center; gap:0.6rem; padding:0.7rem 1.4rem; border-radius:9px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:600; transition:0.2s; }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:var(--accent2); }
        .btn-secondary { background:var(--dim); color:var(--text); border:1px solid var(--border); }
        .btn-danger { background:rgba(224,85,85,0.1); color:var(--red); border:1px solid rgba(224,85,85,0.2); }
        .btn-danger:hover { background:var(--red); color:#fff; }

        .sort-btns { display:flex; gap:4px; }
        .sort-btn { width:30px; height:30px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border-radius:4px; cursor:pointer; border:none; color:var(--text); font-size:10px; transition:0.2s; }
        .sort-btn:hover:not(:disabled) { background:var(--accent); color:#fff; }
        .sort-btn:disabled { opacity:0.3; cursor:not-allowed; }

        .upload-zone { border:2px dashed var(--border); border-radius:12px; padding:2rem; text-align:center; margin-top:1.5rem; cursor:pointer; transition:0.2s; color:var(--muted); }
        .upload-zone:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }
        .upload-zone i { font-size:2rem; margin-bottom:0.8rem; display:block; }

        .icon-field-wrap { position:relative; display:flex; gap:0.5rem; align-items:stretch; }
        .icon-field-wrap .field-input { flex:1; }

<script>
/* ─── CONFIG ─── */
const REPO_DEFAULT = 'christian-word/Audio-PlayEpic';
const BRANCH = 'main';
const raw = `https://raw.githubusercontent.com/${REPO_DEFAULT}/${BRANCH}/`;

/* ─── WAVESURFER ─── */
const wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#cbd5e1',
    progressColor: '#ae5f9d',
    barWidth: 3, barGap: 3, barRadius: 4,
    height: 45, responsive: true, normalize: true,
    backend: 'MediaElement', cursorWidth: 0
});

/* ─── PLAYER STATE ─── */
let allData = [], currentPlaylist = [], currentIdx = 0, currentAlbum = null;
let currentFileUrl = '';
let isShuffled = false, isLoop = false, isMuted = false, prevVol = 1;

/* ─── THEME ─── */
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('lumina-theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lumina-theme', next);
    const isDark = next === 'dark';
    wavesurfer.setOptions({ waveColor: isDark ? '#3a3a52' : '#cbd5e1', progressColor: isDark ? '#c478b4' : '#ae5f9d' });
});

/* ─── VOLUME ─── */
const volSlider = document.getElementById('volume-slider');
volSlider.addEventListener('input', () => {
    const v = parseFloat(volSlider.value);
    wavesurfer.setVolume(v);
    isMuted = v === 0;
    updateVolIcon(v);
});

function toggleMute() {
    if (isMuted) {
        wavesurfer.setVolume(prevVol || 1); volSlider.value = prevVol || 1;
        isMuted = false; updateVolIcon(prevVol || 1);
    } else {
        prevVol = parseFloat(volSlider.value);
        wavesurfer.setVolume(0); volSlider.value = 0;
        isMuted = true; updateVolIcon(0);
    }
}
function updateVolIcon(v) {
    document.getElementById('vol-icon').className = 'fas vol-icon ' + (v === 0 ? 'fa-volume-xmark' : v < 0.5 ? 'fa-volume-low' : 'fa-volume-high');
}

/* ─── SHUFFLE / LOOP ─── */
function toggleShuffle() {
    isShuffled = !isShuffled;
    document.getElementById('btn-shuffle').classList.toggle('active', isShuffled);
    showToast(isShuffled ? '🔀 Случайный порядок вкл.' : 'Случайный порядок выкл.');
}
function toggleLoop() {
    isLoop = !isLoop;
    document.getElementById('btn-loop').classList.toggle('active', isLoop);
    showToast(isLoop ? '🔁 Повтор трека вкл.' : 'Повтор трека выкл.');
}

/* ─── TOAST ─── */
let toastTimer;
function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').innerText = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

/* ─── PLAYER CORE ─── */
function fixUrl(url) {
    if (!url) return '';
    let base = url.startsWith('http') ? url : raw + url;
    return encodeURI(base).replace(/&/g, '%26');
}

function renderAlbums(data) {
    document.getElementById('view-albums').innerHTML = data.map((alb, i) => `
        <div class="album-card" onclick="openAlbumByIndex(${i})">
            <div class="album-img-wrap">
                <img src="${fixUrl(alb.icon)}" class="album-img">
                <div class="album-overlay">
                    <div class="album-overlay-icon"><i class="fas fa-play" style="margin-left:3px;"></i></div>
                </div>
            </div>
            <div class="album-name">${alb.name}</div>
            <div class="album-count">${alb.tracks.length} аудио</div>
        </div>
    `).join('');
}

function openAlbumByIndex(index) {
    currentAlbum = allData[index];
    currentPlaylist = currentAlbum.tracks;
    document.getElementById('view-albums').style.display = 'none';
    document.getElementById('view-tracks').style.display = 'block';
    renderTracks(currentAlbum.tracks);
}

function renderTracks(tracks) {
    document.getElementById('tracks-list').innerHTML =
        `<h3 style="margin-bottom:1rem;font-family:'Syne',sans-serif;font-size:1.15rem;">${currentAlbum.name}</h3>` +
        tracks.map((t, i) => `
            <div class="track ${currentPlaylist[currentIdx]?.name === t.name ? 'active' : ''}" onclick="playTrack(${i})">
                <div class="track-index-wrap">
                    <span class="track-index">${i+1}</span>
                    <i class="fas fa-play track-play-icon"></i>
                    <div class="eq"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>
                </div>
                <img src="${fixUrl(t.icon || currentAlbum.icon)}" style="width:40px;height:40px;border-radius:10px;object-fit:cover;">
                <div style="flex:1;overflow:hidden;min-width:0;">
                    <div style="font-weight:700;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.name}</div>
                </div>
                <div style="font-family:'Share Tech Mono';font-size:0.72rem;color:var(--muted);flex-shrink:0;">${t.duration || ''}</div>
            </div>
        `).join('');
}

function playTrack(idx) {
    currentIdx = idx;
    const track = currentPlaylist[idx];
    let url = track.url.includes('http') ? track.url : raw + track.url;
    url = url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('?dl=0','');
    currentFileUrl = fixUrl(url);
    wavesurfer.load(currentFileUrl);
    document.getElementById('player-name').innerText = track.name;
    document.getElementById('player-album').innerText = currentAlbum.name;
    document.getElementById('player-actions').style.display = 'flex';
    const img = document.getElementById('player-cover');
    img.src = fixUrl(track.icon || currentAlbum.icon);
    img.style.display = 'block';
    document.getElementById('cover-needle').style.display = 'block';
    wavesurfer.on('ready', () => { wavesurfer.play(); updateUI(); }, { once: true });
}

function togglePlay() {
    if (!wavesurfer.isPlaying() && wavesurfer.decodedData === null && currentPlaylist.length > 0) playTrack(0);
    else wavesurfer.playPause();
}
function playNext() {
    if (isShuffled) playTrack(Math.floor(Math.random() * currentPlaylist.length));
    else if (currentIdx < currentPlaylist.length - 1) playTrack(currentIdx + 1);
}
function playPrev() {
    if (wavesurfer.getCurrentTime() > 3) { wavesurfer.seekTo(0); return; }
    if (currentIdx > 0) playTrack(currentIdx - 1);
}
function downloadCurrent() {
    if (!currentFileUrl) return;
    const a = document.createElement('a');
    a.href = currentFileUrl;
    a.download = document.getElementById('player-name').innerText + '.mp3';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function shareTG() {
    if (!currentFileUrl) return;
    const trackName = document.getElementById('player-name').innerText;
    const text = encodeURIComponent(`🎵 Послушайте: ${trackName}\n\n${currentFileUrl}`);
    window.open(`https://t.me/share/url?url=${encodeURIComponent(currentFileUrl)}&text=${text}`, '_blank');
}
function copyLink() {
    if (!currentFileUrl) return;
    navigator.clipboard.writeText(currentFileUrl).then(() => showToast('🔗 Ссылка скопирована!'));
}
function updateUI() {
    const isP = wavesurfer.isPlaying();
    document.getElementById('play-btn').innerHTML = isP ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
    document.getElementById('status-led').classList.toggle('active', isP);
    const cover = document.getElementById('player-cover');
    if (isP) cover.classList.add('spinning'); else cover.classList.remove('spinning');
    if (currentAlbum) renderTracks(currentPlaylist);
}
function showAlbums() {
    document.getElementById('view-tracks').style.display = 'none';
    document.getElementById('view-albums').style.display = 'grid';
}

wavesurfer.on('play', updateUI);
wavesurfer.on('pause', updateUI);
wavesurfer.on('finish', () => {
    if (isLoop) { wavesurfer.seekTo(0); wavesurfer.play(); } else playNext();
});
wavesurfer.on('audioprocess', () => {
    const cur = fmtTime(wavesurfer.getCurrentTime());
    const dur = fmtTime(wavesurfer.getDuration());
    document.getElementById('player-time').innerText = `${cur} / ${dur}`;
});
function fmtTime(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}

document.getElementById('search').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    if (!q) { renderAlbums(allData); return; }
    renderAlbums(allData.filter(a =>
        a.name.toLowerCase().includes(q) ||
        a.tracks.some(t => t.name.toLowerCase().includes(q))
    ));
});

/* ─── INIT PLAYER ─── */
async function initPlayer() {
    try {
        const r = await fetch(raw + 'albums.json');
        allData = await r.json();
        renderAlbums(allData);
    } catch(e) { console.error('Ошибка загрузки медиатеки'); }
}
initPlayer();

/* ════════════════════════════════════════
   ADMIN PANEL LOGIC  —  proxy via Google Apps Script
════════════════════════════════════════ */

// ┌─────────────────────────────────────────────────────┐
// │  ВСТАВЬ СЮДА URL своего Google Apps Script          │
// └─────────────────────────────────────────────────────┘
const PROXY_URL = 'https://script.google.com/macros/s/AKfycbxZJk6AwvbbNZX5s5AliTlvaA2-JguimrWtrerMjGHOwHyS2gdYPTgYrOOJNvSUoyJi/exec';

// PIN-код для входа в админку (можно сменить)
const ADMIN_PIN = '2026';

let A_SHA = '';
let albumsData = [];

document.getElementById('adminOpenBtn').onclick = openAdmin;
document.getElementById('login-btn').onclick = adminLogin;
document.getElementById('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
document.getElementById('add-album-btn').onclick = () => { albumsData.unshift({ name:'Новый Альбом', category:'epic', icon:'', tracks:[] }); adminRender(); adminMarkDirty(); };
document.getElementById('save-btn').onclick = adminSave;
document.getElementById('reload-player-btn').onclick = async () => { await initPlayer(); showToast('✅ Плеер обновлён!'); };

function openAdmin() {
    document.getElementById('admin-panel').style.display = 'block';
    // Если уже авторизован в этой сессии — сразу открываем
    if (sessionStorage.getItem('admin_ok') === '1') {
        document.getElementById('admin-login').style.display = 'none';
        document.getElementById('admin-main').style.display = 'block';
        if (albumsData.length === 0) adminLoadAlbums();
    }
}
function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
function logoutAdmin() {
    sessionStorage.removeItem('admin_ok');
    albumsData = []; A_SHA = '';
    document.getElementById('admin-login').style.display = 'flex';
    document.getElementById('admin-main').style.display = 'none';
}

function adminLogin() {
    const pin = document.getElementById('login-pin').value.trim();
    const errEl = document.getElementById('login-error');
    if (pin !== ADMIN_PIN) {
        errEl.style.display = 'block';
        document.getElementById('login-pin').value = '';
        return;
    }
    errEl.style.display = 'none';
    sessionStorage.setItem('admin_ok', '1');
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-main').style.display = 'block';
    adminLoadAlbums();
}

/* ── Proxy helpers ── */
async function proxyGet(path) {
    const url = `${PROXY_URL}?path=${encodeURIComponent(path)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Proxy GET error');
    return res.json();
}

async function proxyPut(path, content, sha, message) {
    const body = { path, content, message };
    if (sha) body.sha = sha;
    const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // avoid preflight CORS
        body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('Proxy PUT error');
    return res.json();
}

async function adminLoadAlbums() {
    const list = document.getElementById('admin-albums-list');
    list.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted);"><i class="fas fa-circle-notch spin"></i> Загрузка...</div>';
    try {
        const file = await proxyGet('albums.json');
        A_SHA = file.sha;
        albumsData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
        adminRender();
    } catch(e) { list.innerHTML = '<p style="color:var(--red);padding:2rem;">❌ Ошибка подключения к прокси. Проверь URL скрипта.</p>'; }
}

function adminRender() {
    const list = document.getElementById('admin-albums-list');
    list.innerHTML = '';
    albumsData.forEach((album, ai) => {
        const item = document.createElement('div');
        item.className = 'album-item';
        const iconUrl = album.icon && !album.icon.startsWith('http')
            ? `https://raw.githubusercontent.com/${REPO_DEFAULT}/${BRANCH}/${album.icon}`
            : (album.icon || '');

        item.innerHTML = `
            <div class="album-item-header" onclick="this.parentElement.classList.toggle('open')">
                <img src="${iconUrl}" class="album-thumb" onerror="this.src='https://placehold.co/100x100?text=?'">
                <div class="album-info">
                    <div class="album-info-name">${album.name}</div>
                    <div class="album-meta">${album.category} · ${album.tracks.length} ТРЕКОВ</div>
                </div>
                <i class="fas fa-chevron-down chevron"></i>
            </div>
            <div class="album-editor">
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:1.2rem; margin-bottom:1.5rem;">
                    <div>
                        <label class="field-label">Название</label>
                        <input class="field-input" value="${album.name}" oninput="adminUpdateAlbum(${ai},'name',this.value)">
                    </div>
                    <div>
                        <label class="field-label">Категория</label>
                        <input class="field-input" value="${album.category}" oninput="adminUpdateAlbum(${ai},'category',this.value)">
                    </div>
                    <div>
                        <label class="field-label">Иконка</label>
                        <div class="icon-field-wrap">
                            <input class="field-input" id="ai-icon-${ai}" value="${album.icon||''}" oninput="adminUpdateAlbum(${ai},'icon',this.value); adminRefreshIcon(${ai})" placeholder="Music/Album/icon.jpg">
                            <label class="btn-icon-upload" title="Загрузить">
                                <i class="fas fa-image"></i> Загрузить
                                <input type="file" accept="image/*" style="display:none" onchange="adminUploadIcon(${ai},this)">
                            </label>
                        </div>
                        <div class="icon-preview-wrap">
                            <img class="icon-preview-img ${album.icon?'visible':''}" id="ai-icon-prev-${ai}" src="${iconUrl}" onerror="this.classList.remove('visible')">
                            <span class="icon-upload-status" id="ai-icon-st-${ai}">${album.icon?'Иконка задана':'Не выбрана'}</span>
                        </div>
                    </div>
                </div>
                <div style="font-family:'Syne';font-size:0.75rem;margin-bottom:0.8rem;color:var(--muted);letter-spacing:1px;">ТРЕК-ЛИСТ</div>
                <div id="ai-tracks-${ai}"></div>
                <div class="upload-zone" id="ai-drop-${ai}" onclick="document.getElementById('ai-file-${ai}').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    Нажмите для выбора MP3 / перетащите файлы<br>
                    <span style="font-size:0.7rem;opacity:0.6">Авто-расчёт длительности включён</span>
                    <input type="file" id="ai-file-${ai}" multiple style="display:none" onchange="adminUploadFiles(${ai},this.files)">
                </div>
                <div style="margin-top:1.5rem;display:flex;justify-content:flex-end;">
                    <button class="btn btn-danger" style="font-size:0.75rem;padding:0.5rem 1rem;" onclick="adminDeleteAlbum(${ai})"><i class="fas fa-trash-alt"></i> УДАЛИТЬ АЛЬБОМ</button>
                </div>
            </div>
        `;
        list.appendChild(item);
        adminRenderTracks(ai);
    });
}

function adminRenderTracks(ai) {
    const cont = document.getElementById(`ai-tracks-${ai}`);
    const tracks = albumsData[ai].tracks;
    cont.innerHTML = tracks.map((t, ti) => `
        <div class="track-row">
            <input type="text" value="${t.name}" oninput="adminUpdateTrack(${ai},${ti},'name',this.value)" placeholder="Имя">
            <input type="text" value="${t.url}" class="url-col" readonly style="opacity:0.5;font-size:0.7rem;" placeholder="URL">
            <input type="number" value="${t.duration||0}" oninput="adminUpdateTrack(${ai},${ti},'duration',this.value)" title="Секунды">
            <div class="sort-btns">
                <button class="sort-btn" onclick="adminMoveTrack(${ai},${ti},-1)" ${ti===0?'disabled':''}>▲</button>
                <button class="sort-btn" onclick="adminMoveTrack(${ai},${ti},1)" ${ti===tracks.length-1?'disabled':''}>▼</button>
            </div>
            <button class="btn btn-danger" style="padding:0.4rem;background:transparent;border:none;" onclick="adminDeleteTrack(${ai},${ti})"><i class="fas fa-times"></i></button>
        </div>
    `).join('');
}

function adminMarkDirty() { document.getElementById('admin-save-bar').classList.add('visible'); }
function adminUpdateAlbum(ai, k, v) { albumsData[ai][k] = v; adminMarkDirty(); }
function adminUpdateTrack(ai, ti, k, v) { albumsData[ai].tracks[ti][k] = k==='duration' ? parseInt(v) : v; adminMarkDirty(); }
function adminDeleteAlbum(ai) { if(confirm('Удалить альбом?')) { albumsData.splice(ai,1); adminRender(); adminMarkDirty(); } }
function adminDeleteTrack(ai, ti) { albumsData[ai].tracks.splice(ti,1); adminRenderTracks(ai); adminMarkDirty(); }
function adminMoveTrack(ai, ti, dir) {
    const tracks = albumsData[ai].tracks, ni = ti + dir;
    if (ni < 0 || ni >= tracks.length) return;
    [tracks[ti], tracks[ni]] = [tracks[ni], tracks[ti]];
    adminMarkDirty(); adminRenderTracks(ai);
}

async function getAudioDuration(file) {
    return new Promise(resolve => {
        const audio = new Audio();
        const reader = new FileReader();
        reader.onload = e => {
            audio.src = e.target.result;
            audio.onloadedmetadata = () => resolve(Math.round(audio.duration));
            audio.onerror = () => resolve(0);
        };
        reader.readAsDataURL(file);
    });
}

async function adminUploadFiles(ai, files) {
    const album = albumsData[ai];
    const dropZone = document.getElementById(`ai-drop-${ai}`);
    const folder = album.name.trim() || 'New_Album';
    for (let file of Array.from(files)) {
        dropZone.innerHTML = `<i class="fas fa-spinner spin"></i> Загрузка: ${file.name}`;
        const path = `Music/${folder}/${file.name}`;
        try {
            let duration = 0;
            if (file.type.startsWith('audio/') || /\.(mp3|m4a)$/.test(file.name)) {
                duration = await getAudioDuration(file);
            }
            const content = await fileToBase64(file);
            await proxyPut(path, content, null, `Add ${file.name}`);

            if (file.type.startsWith('audio/') || /\.(mp3|m4a)$/.test(file.name)) {
                album.tracks.push({ name: file.name.replace(/\.[^/.]+$/, ''), url: path, duration });
            } else if (file.type.startsWith('image/')) {
                album.icon = path;
            }
            adminMarkDirty(); adminRender();
        } catch(e) { showToast('❌ Ошибка загрузки файла'); }
    }
    adminRender();
}

async function adminUploadIcon(ai, input) {
    const file = input.files[0];
    if (!file) return;
    const album = albumsData[ai];
    const folder = album.name.trim() || 'New_Album';
    const ext = file.name.split('.').pop();
    const path = `Music/${folder}/icon.${ext}`;
    const statusEl = document.getElementById(`ai-icon-st-${ai}`);
    const previewEl = document.getElementById(`ai-icon-prev-${ai}`);
    statusEl.innerHTML = '<i class="fas fa-spinner spin"></i> Загрузка...';
    try {
        const localUrl = URL.createObjectURL(file);
        previewEl.src = localUrl; previewEl.classList.add('visible');

        const content = await fileToBase64(file);
        // Проверяем sha существующего файла через прокси
        let sha = null;
        try { const ex = await proxyGet(path); sha = ex.sha; } catch(e) {}
        await proxyPut(path, content, sha, `Upload icon for ${folder}`);

        album.icon = path;
        document.getElementById(`ai-icon-${ai}`).value = path;
        statusEl.textContent = '✓ Иконка загружена'; statusEl.style.color = 'var(--green)';
        adminMarkDirty();
    } catch(e) { statusEl.textContent = '✗ Ошибка'; statusEl.style.color = 'var(--red)'; }
    input.value = '';
}

function adminRefreshIcon(ai) {
    const album = albumsData[ai];
    const previewEl = document.getElementById(`ai-icon-prev-${ai}`);
    const statusEl = document.getElementById(`ai-icon-st-${ai}`);
    if (!previewEl) return;
    const iconUrl = album.icon && !album.icon.startsWith('http')
        ? `https://raw.githubusercontent.com/${REPO_DEFAULT}/${BRANCH}/${album.icon}` : (album.icon || '');
    if (iconUrl) { previewEl.src = iconUrl; previewEl.classList.add('visible'); statusEl.textContent = 'Иконка задана'; }
    else { previewEl.classList.remove('visible'); statusEl.textContent = 'Не выбрана'; }
}

async function adminSave() {
    const btn = document.getElementById('save-btn');
    btn.innerHTML = '<i class="fas fa-spinner spin"></i> СИНХРОНИЗАЦИЯ...';
    try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(albumsData, null, 4))));
        const result = await proxyPut('albums.json', content, A_SHA, 'Update albums.json via Lumina Admin');
        A_SHA = result.content.sha;
        document.getElementById('admin-save-bar').classList.remove('visible');
        showToast('✅ Данные сохранены в GitHub!');
    } catch(e) { showToast('❌ Ошибка сохранения. Проверь прокси.'); }
    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> СОХРАНИТЬ В GITHUB';
}

/* ── Вспомогательная функция: File → base64 ── */
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
</script>
</body>
</html>
